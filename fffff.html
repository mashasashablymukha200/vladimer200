
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casino Wheel</title>
<style>
body {
  background: radial-gradient(#38205c,#100719);
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 30px 10px;
}
h1 { color: gold; }
.wheel-box {
  position: relative;
  width: 310px;
  height: 310px;
  margin: 35px auto;
}
canvas {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  box-shadow: 0 0 30px gold;
}
.pointer {
  position: absolute;
  top: -15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  color: gold;
  font-size: 35px;
}
button {
  background: linear-gradient(#ffe66b,#ff9800);
  border: none;
  border-radius: 30px;
  padding: 17px 50px;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}
#result {
  color: gold;
  font-size: 25px;
  margin: 25px;
}
</style>
</head>
<body>

<h1>🎰 LUCKY CASINO 🎰</h1>
<h3>Колесо фортуны</h3>

<div class="wheel-box">
  <div class="pointer">▼</div>
  <canvas id="wheel" width="600" height="600"></canvas>
</div>

<button id="spin">КРУТИТЬ!</button>
<div id="result">Испытай удачу!</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const prizes = [
  "100 🪙","500 🪙","50 🪙",
  "1000 🪙","200 🪙","JACKPOT 💎",
  "300 🪙","50 🪙","750 🪙","200 🪙"
];

const colors = [
  "#b71c1c","#212121","#b71c1c",
  "#212121","#b71c1c","#e6a700",
  "#212121","#b71c1c","#212121","#b71c1c"
];

const arc = Math.PI * 2 / prizes.length;
let angle = 0;
let spinning = false;

function draw() {
  ctx.clearRect(0,0,600,600);

  prizes.forEach((prize,i) => {
    const start = angle + i * arc;
    const end = start + arc;

    ctx.beginPath();
    ctx.moveTo(300,300);
    ctx.arc(300,300,285,start,end);
    ctx.closePath();
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.strokeStyle = "gold";
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.save();
    ctx.translate(300,300);
    ctx.rotate(start + arc/2);
    ctx.textAlign = "right";
    ctx.fillStyle = "white";
    ctx.font = "bold 27px Arial";
    ctx.fillText(prize,255,10);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(300,300,48,0,Math.PI*2);
  ctx.fillStyle = "gold";
  ctx.fill();
  ctx.fillStyle = "#300b30";
  ctx.font = "bold 22px Arial";
  ctx.textAlign = "center";
  ctx.fillText("SPIN",300,308);
}

draw();

document.getElementById("spin").onclick = () => {
  if(spinning) return;
  spinning = true;

  document.getElementById("result").textContent = "🎰 Крутим...";

  const start = angle;
  const extra = Math.PI*2*(6+Math.random()*5);
  const duration = 5000;
  const began = performance.now();

  function animate(now) {
    let t = Math.min((now-began)/duration,1);
    let ease = 1-Math.pow(1-t,4);

    angle = start + extra*ease;
    draw();

    if(t<1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;

      let pointerAngle = (Math.PI*1.5-angle)%(Math.PI*2);
      if(pointerAngle<0) pointerAngle+=Math.PI*2;

      let index = Math.floor(pointerAngle/arc);
      document.getElementById("result").textContent =
        "🎉 Выпало: " + prizes[index];
    }
  }

  requestAnimationFrame(animate);
};
</script>
</body>
</html>
